<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>نظام استعلام الدرجات</title>

<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800&display=swap" rel="stylesheet">

<style>
  :root {
    --green: #1a7a4a;
    --green-light: #22964f;
    --green-pale: #e8f5ee;
    --gold: #c8992a;
    --dark: #0d1f14;
    --text: #1a2e1f;
    --muted: #6b8c74;
    --border: #c5dece;
    --white: #ffffff;
    --card-bg: #f5fbf7;
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  html {
    width: 100%;
    overflow-x: hidden;
  }

  body {
    font-family: 'Tajawal', sans-serif;
    background: #f0f7f3;
    min-height: 100vh;
    color: var(--text);
    position: relative;
    overflow-x: hidden;
    width: 100%;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      radial-gradient(circle at 20% 20%, rgba(26,122,74,0.06) 0%, transparent 50%),
      radial-gradient(circle at 80% 80%, rgba(200,153,42,0.05) 0%, transparent 50%);
    pointer-events: none;
    z-index: 0;
  }

  .page-wrapper {
    position: relative;
    z-index: 1;
    max-width: 860px;
    width: 100%;
    margin: 0 auto;
    padding: 40px 20px 60px;
  }

  .header {
    text-align: center;
    margin-bottom: 40px;
    animation: fadeDown 0.6s ease;
  }

  .header-badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: var(--green);
    color: #fff;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 1px;
    padding: 6px 18px;
    border-radius: 20px;
    margin-bottom: 18px;
  }

  .header h1 {
    font-size: 2.2rem;
    font-weight: 800;
    color: var(--dark);
    line-height: 1.2;
    margin-bottom: 10px;
  }

  .header p {
    color: var(--muted);
    font-size: 1rem;
  }

  .status-bar {
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--white);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 18px;
    font-size: 0.85rem;
    color: var(--muted);
    margin-bottom: 20px;
    animation: fadeUp 0.4s ease;
  }

  .status-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #ccc;
    flex-shrink: 0;
    transition: background 0.3s;
  }

  .status-dot.loading {
    background: var(--gold);
    animation: pulse 1s infinite;
  }

  .status-dot.ok {
    background: var(--green);
  }

  .status-dot.err {
    background: #e74c3c;
  }

  .status-refresh {
    margin-right: auto;
    background: none;
    border: 1px solid var(--border);
    color: var(--muted);
    font-family: 'Tajawal', sans-serif;
    font-size: 0.8rem;
    padding: 4px 12px;
    border-radius: 6px;
    cursor: pointer;
    transition: all 0.2s;
    white-space: nowrap;
  }

  .status-refresh:hover {
    background: var(--green-pale);
  }

  .search-card {
    background: var(--white);
    border-radius: 20px;
    padding: 36px 40px;
    box-shadow: 0 4px 30px rgba(26,122,74,0.10);
    border: 1px solid var(--border);
    margin-bottom: 28px;
    animation: fadeUp 0.5s ease 0.1s both;
  }

  .search-label {
    font-size: 0.85rem;
    font-weight: 700;
    color: var(--muted);
    letter-spacing: 0.5px;
    margin-bottom: 10px;
    display: block;
  }

  .search-row {
    display: flex;
    gap: 12px;
    align-items: stretch;
  }

  .search-input {
    flex: 1;
    padding: 14px 20px;
    font-size: 1.05rem;
    font-family: 'Tajawal', sans-serif;
    font-weight: 500;
    border: 2px solid var(--border);
    border-radius: 12px;
    background: var(--card-bg);
    color: var(--text);
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
    direction: ltr;
    text-align: center;
    letter-spacing: 2px;
    min-width: 0;
  }

  .search-input:focus {
    border-color: var(--green);
    box-shadow: 0 0 0 4px rgba(26,122,74,0.10);
  }

  .search-input:disabled {
    background: #eef5f0;
    color: #8da392;
  }

  .search-input::placeholder {
    letter-spacing: 0;
    color: #aabbb0;
    direction: rtl;
    text-align: center;
  }

  .search-btn {
    padding: 14px 32px;
    background: var(--green);
    color: #fff;
    font-family: 'Tajawal', sans-serif;
    font-size: 1rem;
    font-weight: 700;
    border: none;
    border-radius: 12px;
    cursor: pointer;
    transition: background 0.2s, transform 0.1s, box-shadow 0.2s;
    box-shadow: 0 4px 15px rgba(26,122,74,0.25);
    white-space: nowrap;
  }

  .search-btn:hover {
    background: var(--green-light);
    transform: translateY(-1px);
  }

  .search-btn:disabled {
    background: #aac8b5;
    cursor: not-allowed;
    box-shadow: none;
    transform: none;
  }

  .msg-box {
    padding: 16px 22px;
    border-radius: 12px;
    font-size: 0.95rem;
    font-weight: 500;
    margin-top: 14px;
    display: none;
  }

  .msg-error {
    background: #fff3f3;
    border: 1.5px solid #f5c0c0;
    color: #c0392b;
  }

  #result {
    display: none;
    width: 100%;
  }

  .student-hero {
    background: linear-gradient(135deg, var(--green) 0%, #15603a 100%);
    border-radius: 20px;
    padding: 28px 36px;
    color: #fff;
    display: flex;
    align-items: center;
    gap: 22px;
    margin-bottom: 18px;
    box-shadow: 0 8px 30px rgba(26,122,74,0.25);
    position: relative;
    overflow: hidden;
    animation: fadeUp 0.4s ease;
  }

  .student-avatar {
    width: 64px;
    height: 64px;
    background: rgba(255,255,255,0.15);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.8rem;
    flex-shrink: 0;
    border: 2px solid rgba(255,255,255,0.25);
    position: relative;
    z-index: 1;
  }

  .student-info {
    position: relative;
    z-index: 1;
    min-width: 0;
  }

  .student-info h2 {
    font-size: 1.4rem;
    font-weight: 800;
    margin-bottom: 4px;
  }

  .student-info p {
    font-size: 0.9rem;
    opacity: 0.8;
  }

  .student-badge {
    margin-right: auto;
    background: rgba(255,255,255,0.18);
    border: 1.5px solid rgba(255,255,255,0.3);
    border-radius: 30px;
    padding: 8px 20px;
    text-align: center;
    flex-shrink: 0;
    position: relative;
    z-index: 1;
  }

  .student-badge .avg-num {
    font-size: 1.8rem;
    font-weight: 800;
    line-height: 1;
    display: block;
  }

  .student-badge .avg-label {
    font-size: 0.72rem;
    opacity: 0.8;
    font-weight: 500;
  }

  .sections-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
    margin-bottom: 16px;
    width: 100%;
  }

  .section-card {
    background: var(--white);
    border-radius: 16px;
    padding: 22px 24px;
    border: 1px solid var(--border);
    box-shadow: 0 2px 12px rgba(26,122,74,0.06);
    animation: fadeUp 0.4s ease;
    min-width: 0;
    width: 100%;
  }

  .section-title {
    font-size: 0.8rem;
    font-weight: 700;
    color: var(--muted);
    letter-spacing: 0.5px;
    margin-bottom: 16px;
    padding-bottom: 10px;
    border-bottom: 1.5px solid var(--green-pale);
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .section-title .icon {
    width: 24px;
    height: 24px;
    background: var(--green-pale);
    border-radius: 6px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 0.9rem;
    flex-shrink: 0;
  }

  .score-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 9px 0;
    border-bottom: 1px solid #f0f5f2;
    font-size: 0.92rem;
    gap: 10px;
  }

  .score-row:last-child {
    border-bottom: none;
  }

  .score-label {
    color: var(--muted);
    font-weight: 500;
    min-width: 0;
  }

  .score-val {
    font-weight: 700;
    color: var(--text);
    background: var(--card-bg);
    padding: 3px 12px;
    border-radius: 8px;
    font-size: 0.9rem;
    text-align: center;
    min-width: 55px;
    flex-shrink: 0;
  }

  .score-val.submitted {
    color: var(--green);
    background: var(--green-pale);
  }

  .score-val.not-submitted {
    color: #c0392b;
    background: #fff3f3;
  }

  .score-val.absent {
    color: var(--gold);
    background: #fffbf0;
  }

  .category-pill {
    display: inline-block;
    padding: 5px 16px;
    border-radius: 20px;
    font-size: 0.82rem;
    font-weight: 700;
    margin-top: 8px;
  }

  .cat-top {
    background: #e8f5ee;
    color: var(--green);
  }

  .cat-mid {
    background: #fff9e6;
    color: #b5800a;
  }

  .cat-low {
    background: #fff0ee;
    color: #c0392b;
  }

  .cat-neutral {
    background: #edf1f0;
    color: #56665c;
  }

  .bar-row {
    margin-bottom: 14px;
  }

  .bar-label-row {
    display: flex;
    justify-content: space-between;
    font-size: 0.85rem;
    margin-bottom: 5px;
    gap: 10px;
  }

  .bar-label {
    color: var(--muted);
    font-weight: 500;
  }

  .bar-val {
    font-weight: 700;
    color: var(--text);
    white-space: nowrap;
  }

  .bar-track {
    height: 8px;
    background: var(--green-pale);
    border-radius: 10px;
    overflow: hidden;
  }

  .bar-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--green-light), var(--green));
    border-radius: 10px;
    transition: width 0.8s cubic-bezier(0.4,0,0.2,1);
  }

  .page-footer {
    text-align: center;
    margin-top: 40px;
    color: var(--muted);
    font-size: 0.82rem;
  }

  @media screen and (max-width: 700px) {
    .page-wrapper {
      max-width: 100%;
      padding: 24px 14px 40px;
    }

    .header {
      margin-bottom: 28px;
    }

    .header h1 {
      font-size: 1.65rem;
      line-height: 1.35;
    }

    .header p {
      font-size: 0.95rem;
    }

    .header-badge {
      font-size: 11px;
      padding: 6px 14px;
    }

    .status-bar {
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      padding: 10px 14px;
      font-size: 0.82rem;
    }

    .status-refresh {
      margin-right: 0;
      width: 100%;
      padding: 7px 12px;
    }

    .search-card {
      padding: 24px 20px;
      border-radius: 18px;
    }

    .search-row {
      flex-direction: column;
    }

    .search-input,
    .search-btn {
      width: 100%;
    }

    .student-hero {
      flex-wrap: wrap;
      padding: 24px 20px;
    }

    .student-avatar {
      width: 58px;
      height: 58px;
      font-size: 1.6rem;
    }

    .student-info {
      flex: 1 1 100%;
      text-align: center;
    }

    .student-info h2 {
      font-size: 1.25rem;
      line-height: 1.5;
    }

    .student-info p {
      font-size: 0.86rem;
      line-height: 1.7;
    }

    .student-badge {
      margin-right: 0;
      width: 100%;
    }

    .sections-grid {
      grid-template-columns: 1fr !important;
      gap: 14px;
    }

    .section-card {
      padding: 22px 18px;
      border-radius: 16px;
    }

    .score-row {
      gap: 12px;
    }

    .score-label {
      line-height: 1.6;
    }

    .score-val {
      min-width: 55px;
      max-width: 48%;
      white-space: normal;
      word-break: break-word;
    }

    .page-footer {
      font-size: 0.78rem;
      line-height: 1.7;
    }
  }

  @keyframes fadeDown {
    from { opacity: 0; transform: translateY(-20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }
</style>
</head>

<body>
<div class="page-wrapper">

  <div class="header">
    <div class="header-badge">
      <span>📊</span>
      <span id="systemTitle">نظام استعلام الدرجات</span>
    </div>

    <h1 id="pageTitle">ثانوية صفوان بن أمية</h1>
    <p id="pageSubTitle">الأستاذ / ماهر الرحيلي</p>
  </div>

  <div class="status-bar">
    <span class="status-dot ok" id="statusDot"></span>
    <span id="statusText">جاهز للاستعلام. أدخل رقم الطالب ثم اضغط بحث.</span>
    <button class="status-refresh" onclick="resetPage()">🔄 مسح النتيجة</button>
  </div>

  <div class="search-card">
    <span class="search-label">رقم الطالب</span>

    <div class="search-row">
      <input
        type="text"
        id="idInput"
        class="search-input"
        placeholder="أدخل رقم الطالب هنا"
        maxlength="20"
        autocomplete="off"
        onkeydown="if(event.key==='Enter') doSearch()"
      />

      <button class="search-btn" id="searchBtn" onclick="doSearch()">🔍 بحث</button>
    </div>

    <div id="errMsg" class="msg-box msg-error"></div>
  </div>

  <div id="result"></div>

  <div class="page-footer">
    جميع البيانات سرية ومخصصة للطالب فقط &nbsp;•&nbsp; يتم عرض بيانات الطالب المستعلم عنه فقط
  </div>

</div>

<script>
const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbySChwLekWIRCq03vEcS4XDocNtc6QvrVhnxNhThUwGpSA2113JwtOtOuDTuU_dmaoDRQ/exec';

let appSettings = {
  schoolName: 'ثانوية صفوان بن أمية',
  teacherName: 'ماهر الرحيلي',
  systemTitle: 'نظام استعلام الدرجات'
};

document.addEventListener('DOMContentLoaded', function () {
  applyAppSettings();
  setStatus('ok', 'جاهز للاستعلام. أدخل رقم الطالب ثم اضغط بحث.');
  ensureClientId();
});

function ensureClientId() {
  let id = localStorage.getItem('grades_client_id_v1');

  if (!id) {
    id = 'c_' + Math.random().toString(36).slice(2) + '_' + Date.now().toString(36);
    localStorage.setItem('grades_client_id_v1', id);
  }

  return id;
}

function applyAppSettings() {
  document.title = appSettings.schoolName || 'نظام استعلام الدرجات';

  document.getElementById('systemTitle').textContent = appSettings.systemTitle || 'نظام استعلام الدرجات';
  document.getElementById('pageTitle').textContent = appSettings.schoolName || '';
  document.getElementById('pageSubTitle').textContent = appSettings.teacherName ? `الأستاذ / ${appSettings.teacherName}` : '';
}

async function doSearch() {
  const inputEl = document.getElementById('idInput');
  const res = document.getElementById('result');

  const input = inputEl.value.trim();

  hideError();
  res.style.display = 'none';

if (!APPS_SCRIPT_URL || APPS_SCRIPT_URL === 'ضع_رابط_الويب_اب_هنا') {
  showError('لم يتم وضع رابط Apps Script في الكود.');
  setStatus('err', 'رابط Apps Script غير مضاف.');
  return;
}
  if (!input) {
    showError('أدخل رقم الطالب أولًا.');
    return;
  }

  setSearchBusy(true);
  setStatus('loading', 'جارٍ البحث عن بيانات الطالب...');

  try {
    const data = await jsonpRequest(APPS_SCRIPT_URL, {
      action: 'search',
      id: input,
      clientId: ensureClientId()
    });

    if (data.settings) {
      appSettings = {
        ...appSettings,
        ...data.settings
      };
      applyAppSettings();
    }

    if (!data.ok) {
      setStatus('err', data.message || 'لم يتم العثور على البيانات.');
      showError(data.message || 'لم يتم العثور على بيانات لهذا الرقم.');
      return;
    }

    renderStudent(data.student);
    setStatus('ok', '✓ تم عرض بيانات الطالب بنجاح.');

  } catch (e) {
    console.error(e);
    setStatus('err', 'تعذّر الاتصال بخدمة البحث.');
    showError('تعذّر الاتصال بخدمة البحث. تأكد من رابط Apps Script ومن النشر.');
  } finally {
    setSearchBusy(false);
  }
}

function jsonpRequest(url, params) {
  return new Promise((resolve, reject) => {
    const callbackName = 'jsonp_cb_' + Math.random().toString(36).slice(2);
    const script = document.createElement('script');

    params.callback = callbackName;

    const query = Object.keys(params)
      .map(key => encodeURIComponent(key) + '=' + encodeURIComponent(params[key]))
      .join('&');

    const sep = url.includes('?') ? '&' : '?';

    const timeout = setTimeout(() => {
      cleanup();
      reject(new Error('انتهت مهلة الاتصال.'));
    }, 20000);

    window[callbackName] = function (data) {
      cleanup();
      resolve(data);
    };

    script.onerror = function () {
      cleanup();
      reject(new Error('فشل تحميل خدمة البحث.'));
    };

    script.src = url + sep + query;

    function cleanup() {
      clearTimeout(timeout);
      delete window[callbackName];
      if (script.parentNode) {
        script.parentNode.removeChild(script);
      }
    }

    document.body.appendChild(script);
  });
}

function resetPage() {
  document.getElementById('idInput').value = '';
  document.getElementById('idInput').disabled = false;

  hideError();

  const result = document.getElementById('result');
  result.style.display = 'none';
  result.innerHTML = '';

  setSearchBusy(false);
  setStatus('ok', 'جاهز للاستعلام. أدخل رقم الطالب ثم اضغط بحث.');
}

function setSearchBusy(isBusy) {
  const btn = document.getElementById('searchBtn');
  const input = document.getElementById('idInput');

  btn.disabled = isBusy;
  input.disabled = isBusy;

  btn.textContent = isBusy ? 'جارٍ البحث...' : '🔍 بحث';
}

function setStatus(state, msg) {
  document.getElementById('statusDot').className = 'status-dot ' + state;
  document.getElementById('statusText').textContent = msg;
}

function showError(message) {
  const err = document.getElementById('errMsg');
  err.textContent = '⚠️ ' + message;
  err.style.display = 'block';
}

function hideError() {
  const err = document.getElementById('errMsg');
  err.style.display = 'none';
  err.textContent = '';
}

function toNumber(v) {
  const n = parseFloat(String(v || '').replace(',', '.'));
  return isNaN(n) ? 0 : n;
}

function pct(val, max) {
  const n = toNumber(val);
  const m = toNumber(max);

  if (m <= 0) return 0;

  return Math.min(100, Math.max(0, Math.round(n / m * 100)));
}

function formatNumber(n) {
  const x = Number(n);

  if (isNaN(x)) return '0';

  return Number.isInteger(x) ? String(x) : x.toFixed(1);
}

function sc(val) {
  val = String(val || '').trim();

  if (val === 'سلم') return 'submitted';
  if (val === 'لم يسلم' || val === 'لم يكمل') return 'not-submitted';
  if (val === 'غائب') return 'absent';

  return '';
}

function cc(cat) {
  cat = String(cat || '').trim();

  if (cat === 'أعلى من المتوسط') return 'cat-top';
  if (cat === 'في المتوسط') return 'cat-mid';
  if (cat === 'أدنى من المتوسط') return 'cat-low';

  return 'cat-neutral';
}

function escapeHtml(value) {
  return String(value ?? '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#039;');
}

function getSectionSummary(section) {
  if (!section.showSummary) return null;

  const scoredItems = section.items.filter(item =>
    item.max !== null &&
    item.max !== undefined &&
    !isNaN(Number(item.max)) &&
    Number(item.max) > 0
  );

  if (!scoredItems.length) return null;

  const total = scoredItems.reduce((sum, item) => sum + toNumber(item.value), 0);
  const max = scoredItems.reduce((sum, item) => sum + Number(item.max), 0);

  return { total, max };
}

function buildSectionCard(section) {
  const summary = getSectionSummary(section);

  const summaryHtml = summary && summary.max > 0 ? `
    <div class="bar-row">
      <div class="bar-label-row">
        <span class="bar-label">المجموع</span>
        <span class="bar-val">${formatNumber(summary.total)} / ${formatNumber(summary.max)}</span>
      </div>
      <div class="bar-track">
        <div class="bar-fill" style="width:${pct(summary.total, summary.max)}%"></div>
      </div>
    </div>
  ` : '';

  const rows = section.items.map(item => {
    const hasMax =
      item.max !== null &&
      item.max !== undefined &&
      !isNaN(Number(item.max)) &&
      Number(item.max) > 0;

    const value = item.value || '—';
    const valueText = hasMax
      ? `${escapeHtml(value)} / ${escapeHtml(formatNumber(item.max))}`
      : escapeHtml(value);

    return `
      <div class="score-row">
        <span class="score-label">${escapeHtml(item.label)}</span>
        <span class="score-val ${sc(value)}">${valueText}</span>
      </div>
    `;
  }).join('');

  return `
    <div class="section-card">
      <div class="section-title">
        <span class="icon">${escapeHtml(section.icon || '📌')}</span>
        ${escapeHtml(section.name)}
      </div>
      ${summaryHtml}
      ${rows}
    </div>
  `;
}

function renderStudent(student) {
  const res = document.getElementById('result');

  const avgRaw = student.avg || '';
  const cat = student.category || '';
  const avgNum = toNumber(avgRaw);

  const badgeHtml = avgRaw !== '' ? `
    <div class="student-badge">
      <span class="avg-num">${formatNumber(avgNum)}</span>
      <span class="avg-label">متوسط الدرجات</span>
    </div>
  ` : '';

  const categoryHtml = cat !== '' ? `
    <span class="category-pill ${cc(cat)}">${escapeHtml(cat)}</span>
  ` : '';

  const sectionsHtml = (student.sections || []).map(section => {
    return buildSectionCard(section);
  }).join('');

  res.innerHTML = `
    <div class="student-hero">
      <div class="student-avatar">👤</div>

      <div class="student-info">
        <h2>${escapeHtml(student.name || '—')}</h2>
        <p>رقم الطالب: ${escapeHtml(student.id || '')} &nbsp;|&nbsp; الشعبة: ${escapeHtml(student.className || '—')}</p>
        ${categoryHtml}
      </div>

      ${badgeHtml}
    </div>

    <div class="sections-grid">
      ${sectionsHtml || `
        <div class="section-card">
          <div class="section-title">
            <span class="icon">⚠️</span>
            لا توجد أقسام
          </div>
          <div class="score-row">
            <span class="score-label">تنبيه</span>
            <span class="score-val">لا توجد أقسام ظاهرة للعرض</span>
          </div>
        </div>
      `}
    </div>
  `;

  res.style.display = 'block';
}
</script>
