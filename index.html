<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>نظام استعلام الدرجات</title>

<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800&display=swap" rel="stylesheet">

<style>
  :root {
    --green: #1a7a4a;
    --green-light: #22964f;
    --green-pale: #e8f5ee;
    --gold: #c8992a;
    --dark: #0d1f14;
    --text: #1a2e1f;
    --muted: #6b8c74;
    --border: #c5dece;
    --white: #ffffff;
    --card-bg: #f5fbf7;
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  html {
    width: 100%;
    overflow-x: hidden;
  }

  body {
    font-family: 'Tajawal', sans-serif;
    background: #f0f7f3;
    min-height: 100vh;
    color: var(--text);
    position: relative;
    overflow-x: hidden;
    width: 100%;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      radial-gradient(circle at 20% 20%, rgba(26,122,74,0.06) 0%, transparent 50%),
      radial-gradient(circle at 80% 80%, rgba(200,153,42,0.05) 0%, transparent 50%);
    pointer-events: none;
    z-index: 0;
  }

  .page-wrapper {
    position: relative;
    z-index: 1;
    max-width: 860px;
    width: 100%;
    margin: 0 auto;
    padding: 40px 20px 60px;
  }

  .header {
    text-align: center;
    margin-bottom: 40px;
    animation: fadeDown 0.6s ease;
  }

  .header-badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: var(--green);
    color: #fff;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 1px;
    padding: 6px 18px;
    border-radius: 20px;
    margin-bottom: 18px;
  }

  .header h1 {
    font-size: 2.2rem;
    font-weight: 800;
    color: var(--dark);
    line-height: 1.2;
    margin-bottom: 10px;
  }

  .header p {
    color: var(--muted);
    font-size: 1rem;
  }

  .status-bar {
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--white);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 18px;
    font-size: 0.85rem;
    color: var(--muted);
    margin-bottom: 20px;
    animation: fadeUp 0.4s ease;
  }

  .status-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #ccc;
    flex-shrink: 0;
    transition: background 0.3s;
  }

  .status-dot.loading {
    background: var(--gold);
    animation: pulse 1s infinite;
  }

  .status-dot.ok {
    background: var(--green);
  }

  .status-dot.err {
    background: #e74c3c;
  }

  .status-actions {
    margin-right: auto;
    display: flex;
    gap: 8px;
    align-items: center;
  }

  .status-refresh {
    background: none;
    border: 1px solid var(--border);
    color: var(--muted);
    font-family: 'Tajawal', sans-serif;
    font-size: 0.8rem;
    padding: 4px 12px;
    border-radius: 6px;
    cursor: pointer;
    transition: all 0.2s;
    white-space: nowrap;
  }

  .status-refresh:hover {
    background: var(--green-pale);
  }

  .search-card {
    background: var(--white);
    border-radius: 20px;
    padding: 36px 40px;
    box-shadow: 0 4px 30px rgba(26,122,74,0.10);
    border: 1px solid var(--border);
    margin-bottom: 28px;
    animation: fadeUp 0.5s ease 0.1s both;
  }

  .search-label {
    font-size: 0.85rem;
    font-weight: 700;
    color: var(--muted);
    letter-spacing: 0.5px;
    margin-bottom: 10px;
    display: block;
  }

  .search-row {
    display: flex;
    gap: 12px;
    align-items: stretch;
  }

  .search-input {
    flex: 1;
    padding: 14px 20px;
    font-size: 1.05rem;
    font-family: 'Tajawal', sans-serif;
    font-weight: 500;
    border: 2px solid var(--border);
    border-radius: 12px;
    background: var(--card-bg);
    color: var(--text);
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
    direction: ltr;
    text-align: center;
    letter-spacing: 2px;
    min-width: 0;
  }

  .search-input:focus {
    border-color: var(--green);
    box-shadow: 0 0 0 4px rgba(26,122,74,0.10);
  }

  .search-input:disabled {
    background: #eef5f0;
    color: #8da392;
  }

  .search-input::placeholder {
    letter-spacing: 0;
    color: #aabbb0;
    direction: rtl;
    text-align: center;
  }

  .search-btn {
    padding: 14px 32px;
    background: var(--green);
    color: #fff;
    font-family: 'Tajawal', sans-serif;
    font-size: 1rem;
    font-weight: 700;
    border: none;
    border-radius: 12px;
    cursor: pointer;
    transition: background 0.2s, transform 0.1s, box-shadow 0.2s;
    box-shadow: 0 4px 15px rgba(26,122,74,0.25);
    white-space: nowrap;
  }

  .search-btn:hover {
    background: var(--green-light);
    transform: translateY(-1px);
  }

  .search-btn:disabled {
    background: #aac8b5;
    cursor: not-allowed;
    box-shadow: none;
    transform: none;
  }

  .msg-box {
    padding: 16px 22px;
    border-radius: 12px;
    font-size: 0.95rem;
    font-weight: 500;
    margin-top: 14px;
    display: none;
  }

  .msg-error {
    background: #fff3f3;
    border: 1.5px solid #f5c0c0;
    color: #c0392b;
  }

  #result {
    display: none;
    width: 100%;
  }

  .student-hero {
    background: linear-gradient(135deg, var(--green) 0%, #15603a 100%);
    border-radius: 20px;
    padding: 28px 36px;
    color: #fff;
    display: flex;
    align-items: center;
    gap: 22px;
    margin-bottom: 18px;
    box-shadow: 0 8px 30px rgba(26,122,74,0.25);
    position: relative;
    overflow: hidden;
    animation: fadeUp 0.4s ease;
  }

  .student-avatar {
    width: 64px;
    height: 64px;
    background: rgba(255,255,255,0.15);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.8rem;
    flex-shrink: 0;
    border: 2px solid rgba(255,255,255,0.25);
    position: relative;
    z-index: 1;
  }

  .student-info {
    position: relative;
    z-index: 1;
    min-width: 0;
  }

  .student-info h2 {
    font-size: 1.4rem;
    font-weight: 800;
    margin-bottom: 4px;
  }

  .student-info p {
    font-size: 0.9rem;
    opacity: 0.8;
  }

  .student-badge {
    margin-right: auto;
    background: rgba(255,255,255,0.18);
    border: 1.5px solid rgba(255,255,255,0.3);
    border-radius: 30px;
    padding: 8px 20px;
    text-align: center;
    flex-shrink: 0;
    position: relative;
    z-index: 1;
  }

  .student-badge .avg-num {
    font-size: 1.8rem;
    font-weight: 800;
    line-height: 1;
    display: block;
  }

  .student-badge .avg-label {
    font-size: 0.72rem;
    opacity: 0.8;
    font-weight: 500;
  }

  .sections-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
    margin-bottom: 16px;
    width: 100%;
  }

  .section-card {
    background: var(--white);
    border-radius: 16px;
    padding: 22px 24px;
    border: 1px solid var(--border);
    box-shadow: 0 2px 12px rgba(26,122,74,0.06);
    animation: fadeUp 0.4s ease;
    min-width: 0;
    width: 100%;
  }

  .section-title {
    font-size: 0.8rem;
    font-weight: 700;
    color: var(--muted);
    letter-spacing: 0.5px;
    margin-bottom: 16px;
    padding-bottom: 10px;
    border-bottom: 1.5px solid var(--green-pale);
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .section-title .icon {
    width: 24px;
    height: 24px;
    background: var(--green-pale);
    border-radius: 6px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 0.9rem;
    flex-shrink: 0;
  }

  .score-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 9px 0;
    border-bottom: 1px solid #f0f5f2;
    font-size: 0.92rem;
    gap: 10px;
  }

  .score-row:last-child {
    border-bottom: none;
  }

  .score-label {
    color: var(--muted);
    font-weight: 500;
    min-width: 0;
  }

  .score-val {
    font-weight: 700;
    color: var(--text);
    background: var(--card-bg);
    padding: 3px 12px;
    border-radius: 8px;
    font-size: 0.9rem;
    text-align: center;
    min-width: 55px;
    flex-shrink: 0;
  }

  .score-val.submitted {
    color: var(--green);
    background: var(--green-pale);
  }

  .score-val.not-submitted {
    color: #c0392b;
    background: #fff3f3;
  }

  .score-val.absent {
    color: var(--gold);
    background: #fffbf0;
  }

  .category-pill {
    display: inline-block;
    padding: 5px 16px;
    border-radius: 20px;
    font-size: 0.82rem;
    font-weight: 700;
    margin-top: 8px;
  }

  .cat-top {
    background: #e8f5ee;
    color: var(--green);
  }

  .cat-mid {
    background: #fff9e6;
    color: #b5800a;
  }

  .cat-low {
    background: #fff0ee;
    color: #c0392b;
  }

  .cat-neutral {
    background: #edf1f0;
    color: #56665c;
  }

  .bar-row {
    margin-bottom: 14px;
  }

  .bar-label-row {
    display: flex;
    justify-content: space-between;
    font-size: 0.85rem;
    margin-bottom: 5px;
    gap: 10px;
  }

  .bar-label {
    color: var(--muted);
    font-weight: 500;
  }

  .bar-val {
    font-weight: 700;
    color: var(--text);
    white-space: nowrap;
  }

  .bar-track {
    height: 8px;
    background: var(--green-pale);
    border-radius: 10px;
    overflow: hidden;
  }

  .bar-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--green-light), var(--green));
    border-radius: 10px;
    transition: width 0.8s cubic-bezier(0.4,0,0.2,1);
  }

  .page-footer {
    text-align: center;
    margin-top: 40px;
    color: var(--muted);
    font-size: 0.82rem;
  }

  @media screen and (max-width: 700px) {
    .page-wrapper {
      max-width: 100%;
      padding: 24px 14px 40px;
    }

    .header {
      margin-bottom: 28px;
    }

    .header h1 {
      font-size: 1.65rem;
      line-height: 1.35;
    }

    .header p {
      font-size: 0.95rem;
    }

    .header-badge {
      font-size: 11px;
      padding: 6px 14px;
    }

    .status-bar {
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      padding: 10px 14px;
      font-size: 0.82rem;
    }

    .status-actions {
      margin-right: 0;
      width: 100%;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .status-refresh {
      width: 100%;
      padding: 7px 12px;
    }

    .search-card {
      padding: 24px 20px;
      border-radius: 18px;
    }

    .search-row {
      flex-direction: column;
    }

    .search-input,
    .search-btn {
      width: 100%;
    }

    .student-hero {
      flex-wrap: wrap;
      padding: 24px 20px;
    }

    .student-avatar {
      width: 58px;
      height: 58px;
      font-size: 1.6rem;
    }

    .student-info {
      flex: 1 1 100%;
      text-align: center;
    }

    .student-info h2 {
      font-size: 1.25rem;
      line-height: 1.5;
    }

    .student-info p {
      font-size: 0.86rem;
      line-height: 1.7;
    }

    .student-badge {
      margin-right: 0;
      width: 100%;
    }

    .sections-grid {
      grid-template-columns: 1fr !important;
      gap: 14px;
    }

    .section-card {
      padding: 22px 18px;
      border-radius: 16px;
    }

    .score-row {
      gap: 12px;
    }

    .score-label {
      line-height: 1.6;
    }

    .score-val {
      min-width: 55px;
      max-width: 48%;
      white-space: normal;
      word-break: break-word;
    }

    .page-footer {
      font-size: 0.78rem;
      line-height: 1.7;
    }
  }

  @keyframes fadeDown {
    from { opacity: 0; transform: translateY(-20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }
</style>
</head>

<body>
<div class="page-wrapper">

  <div class="header">
    <div class="header-badge">
      <span>📊</span>
      <span id="systemTitle">نظام استعلام الدرجات</span>
    </div>

    <h1 id="pageTitle">ثانوية صفوان بن أمية</h1>
    <p id="pageSubTitle">الأستاذ / ماهر الرحيلي</p>
  </div>

  <div class="status-bar">
    <span class="status-dot ok" id="statusDot"></span>
    <span id="statusText">جاهز للاستعلام. أدخل رقم الطالب ثم اضغط بحث.</span>

    <div class="status-actions">
      <button class="status-refresh" onclick="resetPage()">🔄 مسح النتيجة</button>
      <button class="status-refresh" onclick="refreshData()">♻️ تحديث البيانات</button>
    </div>
  </div>

  <div class="search-card">
    <span class="search-label">رقم الطالب</span>

    <div class="search-row">
      <input
        type="text"
        id="idInput"
        class="search-input"
        placeholder="أدخل رقم الطالب هنا"
        maxlength="20"
        autocomplete="off"
        onkeydown="if(event.key==='Enter') doSearch()"
      />

      <button class="search-btn" id="searchBtn" onclick="doSearch()">🔍 بحث</button>
    </div>

    <div id="errMsg" class="msg-box msg-error"></div>
  </div>

  <div id="result"></div>

  <div class="page-footer">
    جميع البيانات سرية ومخصصة للطالب فقط &nbsp;•&nbsp; يتم عرض بيانات الطالب المستعلم عنه فقط
  </div>

</div>

<script>
// ============================================================
// إعدادات Google Sheets
// ============================================================
const SPREADSHEET_ID = '1ty4VIwtzuyxV_p0lp7Jh0yEbOHmTT_u3qo3OUDORez8';
const SHEET_NAME = 'A';

// أسماء ورقة الإعدادات المقبولة
const SETTINGS_SHEET_NAMES = ['الإعدادات', 'Settings'];

// ============================================================
// إعدادات افتراضية في حال لم تُقرأ ورقة الإعدادات
// ============================================================
const appSettings = {
  schoolName: 'ثانوية صفوان بن أمية',
  stage: 'المرحلة الثانوية',
  teacherName: 'ماهر الرحيلي',
  systemTitle: 'نظام استعلام الدرجات'
};

const securitySettings = {
  maxFailedAttempts: 5,
  lockMinutes: 1,
  minIdLength: 1,
  logLimit: 100
};

const displaySettings = {
  hiddenSections: []
};

// ============================================================
// مفاتيح التخزين المحلي
// ============================================================
const ATTEMPT_STATE_KEY = 'grades_attempt_state_v1';
const ATTEMPT_LOG_KEY = 'grades_attempt_log_v1';

// ============================================================
// ثوابت الأعمدة الأساسية
// ============================================================
const ID_KEY = 'رقم الطالب';
const NAME_KEY = 'اسم الطالب';
const CLASS_KEY = 'الشعبة';
const AVG_KEY = 'متوسط الطالب';
const CAT_KEY = 'الفئة';

// ============================================================
// متغيرات عامة
// ============================================================
let cachedData = null;
let columns = [];
let currentStudent = null;

// ============================================================
// تهيئة الصفحة
// ============================================================
document.addEventListener('DOMContentLoaded', initializeApp);

async function initializeApp() {
  applyAppSettings();
  setStatus('loading', 'جارٍ تحميل الإعدادات...');

  await loadRemoteSettings();

  applyAppSettings();

  if (isSearchLocked()) {
    const msg = `تم إيقاف البحث مؤقتًا. حاول بعد ${getLockRemainingText()}.`;
    setStatus('err', msg);
    showError(msg);
  } else {
    setStatus('ok', 'جاهز للاستعلام. أدخل رقم الطالب ثم اضغط بحث.');
  }
}

// ============================================================
// قراءة الإعدادات من Google Sheets
// ============================================================
async function loadRemoteSettings() {
  for (const sheetName of SETTINGS_SHEET_NAMES) {
    try {
      const table = await fetchGvizTable(sheetName);
      const rows = gvizTableToRows(table);

      if (!rows.length) continue;

      applySettingsRows(rows);
      return true;
    } catch (e) {
      console.warn(`لم يتم تحميل ورقة الإعدادات: ${sheetName}`, e);
    }
  }

  return false;
}

function applySettingsRows(rows) {
  rows.forEach(row => {
    const key = normalizeSettingKey(row[0]);
    const value = String(row[1] ?? '').trim();

    if (!key || value === '') return;

    if (['schoolname', 'اسم المدرسة', 'المدرسة'].includes(key)) {
      appSettings.schoolName = value;
    }

    else if (['teachername', 'اسم المعلم', 'المعلم', 'اسم الأستاذ', 'اسم الاستاذ'].includes(key)) {
      appSettings.teacherName = value;
    }

    else if (['systemtitle', 'عنوان النظام', 'اسم النظام'].includes(key)) {
      appSettings.systemTitle = value;
    }

    else if (['stage', 'المرحلة'].includes(key)) {
      appSettings.stage = value;
    }

    else if (['maxfailedattempts', 'عدد المحاولات', 'عدد المحاولات الفاشلة', 'محاولات الفشل'].includes(key)) {
      const n = toNumber(value);
      if (n > 0) securitySettings.maxFailedAttempts = Math.floor(n);
    }

    else if (['lockminutes', 'مدة الإيقاف', 'مدة الايقاف', 'مدة الإيقاف بالدقائق', 'مدة الايقاف بالدقائق'].includes(key)) {
      const n = toNumber(value);
      if (n > 0) securitySettings.lockMinutes = Math.floor(n);
    }

    else if (['minidlength', 'أقل طول للرقم', 'اقل طول للرقم', 'أقل طول رقم الطالب', 'اقل طول رقم الطالب'].includes(key)) {
      const n = toNumber(value);
      if (n > 0) securitySettings.minIdLength = Math.floor(n);
    }

    else if (['loglimit', 'عدد السجلات', 'حد السجل'].includes(key)) {
      const n = toNumber(value);
      if (n > 0) securitySettings.logLimit = Math.floor(n);
    }

    else if (['hiddensections', 'الأقسام المخفية', 'الاقسام المخفية', 'إخفاء الأقسام', 'اخفاء الاقسام'].includes(key)) {
      displaySettings.hiddenSections = value
        .split(/[,،]/)
        .map(x => normalizeText(x))
        .filter(Boolean);
    }
  });
}

function normalizeSettingKey(v) {
  return String(v || '')
    .trim()
    .replace(/\s+/g, ' ')
    .toLowerCase();
}

function applyAppSettings() {
  document.title = appSettings.schoolName || 'نظام استعلام الدرجات';

  const systemTitle = document.getElementById('systemTitle');
  const pageTitle = document.getElementById('pageTitle');
  const pageSubTitle = document.getElementById('pageSubTitle');

  if (systemTitle) systemTitle.textContent = appSettings.systemTitle || 'نظام استعلام الدرجات';
  if (pageTitle) pageTitle.textContent = appSettings.schoolName || '';

  if (pageSubTitle) {
    pageSubTitle.textContent = appSettings.teacherName
      ? `الأستاذ / ${appSettings.teacherName}`
      : '';
  }
}

// ============================================================
// جلب جدول بصيغة GViz
// ============================================================
async function fetchGvizTable(sheetName) {
  const url = `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/gviz/tq?tqx=out:json&sheet=${encodeURIComponent(sheetName)}`;
  const response = await fetch(url);

  if (!response.ok) {
    throw new Error('تعذّر الاتصال بقاعدة البيانات.');
  }

  const text = await response.text();
  const jsonMatch = text.match(/google\.visualization\.Query\.setResponse\(([\s\S]+)\);?$/);

  if (!jsonMatch) {
    throw new Error('لم يتم التعرف على تنسيق البيانات.');
  }

  const data = JSON.parse(jsonMatch[1]);

  if (data.status === 'error') {
    throw new Error('خطأ في جلب البيانات.');
  }

  return data.table;
}

function gvizTableToRows(table) {
  const colCount = table.cols.length;
  const rows = [];

  for (const row of table.rows) {
    const rowData = [];

    for (let i = 0; i < colCount; i++) {
      const cell = row.c && row.c[i] ? row.c[i] : null;

      if (!cell) {
        rowData.push('');
      } else {
        const value = cell.f !== undefined && cell.f !== null
          ? String(cell.f)
          : (cell.v !== undefined && cell.v !== null ? String(cell.v) : '');

        rowData.push(value);
      }
    }

    rows.push(rowData);
  }

  return rows;
}

// ============================================================
// جلب بيانات الطلاب
// ============================================================
async function fetchSheetData() {
  if (cachedData) return cachedData;

  const table = await fetchGvizTable(SHEET_NAME);

  const labels = table.cols.map(col => String(col.label || '').trim());
  const rows = gvizTableToRows(table);

  const maxRow = rows[0] ? rows[0].map(v => String(v || '').trim()) : [];
  const studentRows = rows.slice(1);

  const cols = [];
  let currentSection = '';

  for (let i = 0; i < labels.length; i++) {
    const rawLabel = labels[i];
    if (!rawLabel) continue;

    let section = '';
    let item = rawLabel;

    const firstChar = rawLabel.charAt(0);
    const isEmoji = firstChar && !/[\u0600-\u06FF\u0750-\u077Fa-zA-Z0-9\s]/.test(firstChar);

    if (isEmoji) {
      const match = rawLabel.match(/^([^\u0600-\u06FF\u0750-\u077Fa-zA-Z0-9\s]+)(.+)/);

      if (match) {
        const fullText = match[2].trim();
        const doubleSpaceIdx = fullText.indexOf('  ');

        if (doubleSpaceIdx > 0) {
          section = match[1] + fullText.substring(0, doubleSpaceIdx).trim();
          item = fullText.substring(doubleSpaceIdx).trim();
          currentSection = section;
        } else {
          section = currentSection || rawLabel;
          item = fullText;
        }
      }
    } else {
      const doubleSpaceIdx = rawLabel.indexOf('  ');

      if (doubleSpaceIdx > 0) {
        section = rawLabel.substring(0, doubleSpaceIdx).trim();
        item = rawLabel.substring(doubleSpaceIdx).trim();
        currentSection = section;
      } else if (rawLabel.startsWith('الانضباط') || rawLabel.startsWith('الاختبارات')) {
        const spaceIdx = rawLabel.indexOf(' ');

        if (spaceIdx > 0) {
          section = rawLabel.substring(0, spaceIdx).trim();
          item = rawLabel.substring(spaceIdx).trim();
          currentSection = section;
        }
      } else {
        section = currentSection;
        item = rawLabel;
      }
    }

    const maxRaw = (maxRow[i] || '').trim();
    const maxNumber = parseFloat(maxRaw.replace(',', '.'));

    let maxType = 'fixed';
    let max = null;
    let maxIndex = null;

    const maxUpper = maxRaw.toUpperCase();

    if (maxRaw === 'التالي' || maxUpper === 'NEXT') {
      maxType = 'nextColumn';
      maxIndex = i + 1;
    } else if (maxRaw === 'أعلى الشعبة' || maxUpper === 'MAX_BY_CLASS') {
      maxType = 'maxByClass';
    } else if (
      maxRaw === 'مخفي القسم' ||
      maxRaw === 'إخفاء القسم' ||
      maxRaw === 'اخفاء القسم' ||
      maxUpper === 'HIDE_SECTION'
    ) {
      maxType = 'hiddenSection';
    } else if (maxRaw === 'مخفي' || maxUpper === 'HIDE') {
      maxType = 'hidden';
    } else if (maxRaw !== '' && !isNaN(maxNumber)) {
      maxType = 'fixed';
      max = maxNumber;
    }

    cols.push({
      index: i,
      section: section || 'بيانات الطالب',
      item,
      max,
      maxType,
      maxIndex,
      sectionHidden: false
    });
  }

  const sectionsToHide = new Set();

  cols.forEach(col => {
    const sectionName = extractSectionInfo(col.section).name;

    if (col.maxType === 'hiddenSection') {
      sectionsToHide.add(normalizeText(sectionName));
    }

    if (displaySettings.hiddenSections.includes(normalizeText(sectionName))) {
      sectionsToHide.add(normalizeText(sectionName));
    }
  });

  cols.forEach(col => {
    const sectionName = extractSectionInfo(col.section).name;
    col.sectionHidden = sectionsToHide.has(normalizeText(sectionName));
  });

  const parsedRows = studentRows.map(row => {
    const obj = { __cells: {} };

    cols.forEach(col => {
      const value = row[col.index] || '';
      obj[col.item] = value;
      obj.__cells[col.index] = value;
    });

    return obj;
  }).filter(row => {
    return Object.keys(row).some(k => {
      if (k === '__cells') return false;
      return String(row[k]).trim() !== '';
    });
  });

  cachedData = { columns: cols, rows: parsedRows };
  columns = cols;

  return cachedData;
}

// ============================================================
// البحث عن طالب
// ============================================================
function normalizeId(v) {
  let x = String(v || '')
    .trim()
    .replace(/\s/g, '')
    .replace(/[^\dA-Za-z\u0600-\u06FF]/g, '');

  if (/^\d+$/.test(x)) {
    x = x.replace(/^0+/, '');
  }

  return x || '';
}

function searchStudentInData(model, studentId) {
  const cleanInput = normalizeId(studentId);

  if (!cleanInput) {
    return { ok: false, message: 'أدخل رقم الطالب أولًا.' };
  }

  const idCol = model.columns.find(col => col.item.includes('رقم الطالب'));

  if (!idCol) {
    return { ok: false, message: 'لم يتم العثور على عمود باسم "رقم الطالب" في جدول البيانات.' };
  }

  const classCol = model.columns.find(col => col.item.includes('الشعبة'));

  const student = model.rows.find(row => {
    return normalizeId(row.__cells[idCol.index]) === cleanInput;
  });

  if (!student) {
    return { ok: false, message: 'لم يتم العثور على بيانات لهذا الرقم. تأكد من صحة رقم الطالب.' };
  }

  const studentClass = classCol ? String(student.__cells[classCol.index] || '').trim() : '';

  const processedColumns = model.columns.map(col => {
    if (col.maxType === 'maxByClass') {
      let maxVal = 0;

      model.rows.forEach(row => {
        const rowClass = classCol ? String(row.__cells[classCol.index] || '').trim() : '';

        if (rowClass === studentClass) {
          const n = parseFloat(String(row.__cells[col.index] || '').replace(',', '.'));
          if (!isNaN(n) && n > maxVal) maxVal = n;
        }
      });

      return {
        ...col,
        max: maxVal > 0 ? maxVal : null,
        maxType: 'fixed'
      };
    }

    return col;
  });

  return {
    ok: true,
    student,
    columns: processedColumns
  };
}

// ============================================================
// الحماية وسجل المحاولات المحلي
// ============================================================
function getNowMs() {
  return Date.now();
}

function loadAttemptState() {
  try {
    const raw = localStorage.getItem(ATTEMPT_STATE_KEY);

    if (!raw) {
      return { failedCount: 0, lockUntil: 0 };
    }

    const state = JSON.parse(raw);

    return {
      failedCount: Number(state.failedCount) || 0,
      lockUntil: Number(state.lockUntil) || 0
    };
  } catch {
    return { failedCount: 0, lockUntil: 0 };
  }
}

function saveAttemptState(state) {
  localStorage.setItem(ATTEMPT_STATE_KEY, JSON.stringify({
    failedCount: Number(state.failedCount) || 0,
    lockUntil: Number(state.lockUntil) || 0
  }));
}

function clearAttemptState() {
  saveAttemptState({
    failedCount: 0,
    lockUntil: 0
  });
}

function isSearchLocked() {
  const state = loadAttemptState();

  if (Number(state.lockUntil) > getNowMs()) {
    return true;
  }

  if (Number(state.lockUntil) > 0 && Number(state.lockUntil) <= getNowMs()) {
    clearAttemptState();
  }

  return false;
}

function getLockRemainingText() {
  const state = loadAttemptState();
  const remainingMs = Math.max(0, Number(state.lockUntil) - getNowMs());
  const remainingMinutes = Math.ceil(remainingMs / 60000);

  return `${remainingMinutes} دقيقة`;
}

function maskStudentId(id) {
  const x = String(id || '').trim();

  if (x.length <= 3) {
    return '***';
  }

  return '*'.repeat(Math.max(0, x.length - 3)) + x.slice(-3);
}

function loadAttemptLog() {
  try {
    const raw = localStorage.getItem(ATTEMPT_LOG_KEY);

    if (!raw) {
      return [];
    }

    const log = JSON.parse(raw);

    return Array.isArray(log) ? log : [];
  } catch {
    return [];
  }
}

function saveAttemptLog(log) {
  const safeLog = Array.isArray(log)
    ? log.slice(0, securitySettings.logLimit)
    : [];

  localStorage.setItem(ATTEMPT_LOG_KEY, JSON.stringify(safeLog));
}

function addAttemptLog(entry) {
  const log = loadAttemptLog();

  log.unshift({
    time: new Date().toLocaleString('ar-SA'),
    studentId: maskStudentId(entry.studentId),
    status: entry.status,
    message: entry.message || '',
    studentName: entry.studentName || '',
    studentClass: entry.studentClass || ''
  });

  saveAttemptLog(log);
}

function registerSuccessAttempt(studentId, student) {
  clearAttemptState();

  addAttemptLog({
    studentId,
    status: 'نجاح',
    message: 'تم العثور على الطالب',
    studentName: getValueByItem(student, NAME_KEY),
    studentClass: getValueByItem(student, CLASS_KEY)
  });
}

function registerFailedAttempt(studentId, message) {
  const state = loadAttemptState();
  const failedCount = Number(state.failedCount) + 1;

  let lockUntil = 0;
  let finalMessage = message || 'محاولة فاشلة';

  if (failedCount >= securitySettings.maxFailedAttempts) {
    lockUntil = getNowMs() + securitySettings.lockMinutes * 60 * 1000;
    finalMessage = `تم إيقاف البحث مؤقتًا لمدة ${securitySettings.lockMinutes} دقيقة بسبب كثرة المحاولات الفاشلة.`;
  }

  saveAttemptState({
    failedCount,
    lockUntil
  });

  addAttemptLog({
    studentId,
    status: 'فشل',
    message: finalMessage
  });

  return {
    locked: lockUntil > 0,
    message: finalMessage,
    failedCount
  };
}

function showAttemptLogInConsole() {
  console.table(loadAttemptLog());
}

function clearAttemptLog() {
  localStorage.removeItem(ATTEMPT_LOG_KEY);
}

// ============================================================
// واجهة المستخدم
// ============================================================
function resetPage() {
  currentStudent = null;
  columns = cachedData ? cachedData.columns : [];

  document.getElementById('idInput').value = '';
  document.getElementById('idInput').disabled = false;

  hideError();

  document.getElementById('result').style.display = 'none';
  document.getElementById('result').innerHTML = '';

  setSearchBusy(false);

  if (isSearchLocked()) {
    const msg = `تم إيقاف البحث مؤقتًا. حاول بعد ${getLockRemainingText()}.`;
    setStatus('err', msg);
    showError(msg);
  } else {
    setStatus('ok', 'جاهز للاستعلام. أدخل رقم الطالب ثم اضغط بحث.');
  }
}

async function refreshData() {
  cachedData = null;
  currentStudent = null;
  columns = [];

  document.getElementById('result').style.display = 'none';
  document.getElementById('result').innerHTML = '';

  hideError();
  setSearchBusy(true);
  setStatus('loading', 'جارٍ تحديث الإعدادات والبيانات...');

  try {
    await loadRemoteSettings();
    applyAppSettings();
    await fetchSheetData();

    setStatus('ok', '✓ تم تحديث الإعدادات والبيانات بنجاح.');
  } catch (e) {
    console.error(e);
    setStatus('err', 'تعذّر تحديث البيانات.');
    showError('تعذّر تحديث البيانات. تأكد من اتصالك بالإنترنت أو من صلاحيات جدول البيانات.');
  } finally {
    setSearchBusy(false);
  }
}

async function doSearch() {
  const inputEl = document.getElementById('idInput');
  const res = document.getElementById('result');

  const input = inputEl.value.trim();

  hideError();
  res.style.display = 'none';

  if (isSearchLocked()) {
    const msg = `تم إيقاف البحث مؤقتًا. حاول بعد ${getLockRemainingText()}.`;
    setStatus('err', msg);
    showError(msg);
    return;
  }

  if (!input) {
    showError('أدخل رقم الطالب أولًا.');
    return;
  }

  const cleanInput = normalizeId(input);

  if (cleanInput.length < securitySettings.minIdLength) {
    const fail = registerFailedAttempt(input, 'رقم الطالب قصير جدًا أو غير مكتمل.');

    setStatus('err', fail.message);
    showError(fail.message);
    return;
  }

  setSearchBusy(true);
  setStatus('loading', 'جارٍ البحث عن بيانات الطالب...');

  try {
    const model = await fetchSheetData();
    const result = searchStudentInData(model, input);

    if (!result.ok) {
      const fail = registerFailedAttempt(input, result.message);

      setStatus('err', fail.message);
      showError(fail.message);
    } else {
      currentStudent = result.student;
      columns = result.columns;

      renderStudent(currentStudent);
      registerSuccessAttempt(input, currentStudent);

      setStatus('ok', '✓ تم عرض بيانات الطالب بنجاح.');
    }
  } catch (e) {
    console.error(e);

    const fail = registerFailedAttempt(input, 'تعذّر الاتصال بقاعدة البيانات.');

    setStatus('err', fail.message);
    showError('تعذّر الاتصال بقاعدة البيانات. تأكد من اتصالك بالإنترنت أو من صلاحيات جدول البيانات.');
  } finally {
    setSearchBusy(false);
  }
}

function setSearchBusy(isBusy) {
  const btn = document.getElementById('searchBtn');
  const input = document.getElementById('idInput');

  btn.disabled = isBusy;
  input.disabled = isBusy;

  if (isBusy) {
    btn.textContent = 'جارٍ البحث...';
  } else {
    btn.textContent = '🔍 بحث';
  }
}

function setStatus(state, msg) {
  document.getElementById('statusDot').className = 'status-dot ' + state;
  document.getElementById('statusText').textContent = msg;
}

function showError(message) {
  const err = document.getElementById('errMsg');
  err.textContent = '⚠️ ' + message;
  err.style.display = 'block';
}

function hideError() {
  const err = document.getElementById('errMsg');
  err.style.display = 'none';
  err.textContent = '';
}

// ============================================================
// دوال مساعدة
// ============================================================
function getValueByItem(student, item) {
  let col = columns.find(c => c.item === item);

  if (!col) {
    col = columns.find(c => c.item.includes(item) || item.includes(c.item));
  }

  if (col && student.__cells) {
    const value = student.__cells[col.index];

    if (value !== undefined && value !== null && String(value).trim() !== '') {
      return String(value).trim();
    }
  }

  return '';
}

function toNumber(v) {
  const n = parseFloat(String(v || '').replace(',', '.'));
  return isNaN(n) ? 0 : n;
}

function pct(val, max) {
  const n = toNumber(val);
  const m = toNumber(max);

  if (m <= 0) {
    return 0;
  }

  return Math.min(100, Math.max(0, Math.round(n / m * 100)));
}

function formatNumber(n) {
  const x = Number(n);

  if (isNaN(x)) {
    return '0';
  }

  return Number.isInteger(x) ? String(x) : x.toFixed(1);
}

function sc(val) {
  val = String(val || '').trim();

  if (val === 'سلم') return 'submitted';
  if (val === 'لم يسلم' || val === 'لم يكمل') return 'not-submitted';
  if (val === 'غائب') return 'absent';

  return '';
}

function cc(cat) {
  cat = String(cat || '').trim();

  if (cat === 'أعلى من المتوسط') return 'cat-top';
  if (cat === 'في المتوسط') return 'cat-mid';
  if (cat === 'أدنى من المتوسط') return 'cat-low';

  return 'cat-neutral';
}

function escapeHtml(value) {
  return String(value ?? '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#039;');
}

function normalizeText(v) {
  return String(v || '')
    .trim()
    .replace(/\s+/g, ' ')
    .replace(/[إأآا]/g, 'ا')
    .replace(/ة/g, 'ه')
    .replace(/ى/g, 'ي')
    .toLowerCase();
}

function extractSectionInfo(rawSectionName) {
  const text = String(rawSectionName || '').trim();
  const firstChar = text.charAt(0);

  if (firstChar && !/[\u0600-\u06FF\u0750-\u077Fa-zA-Z0-9\s]/.test(firstChar)) {
    const match = text.match(/^([^\u0600-\u06FF\u0750-\u077Fa-zA-Z0-9\s]+)\s*(.+)/);

    if (match) {
      return {
        icon: match[1],
        name: match[2].trim()
      };
    }
  }

  return {
    icon: '📌',
    name: text || 'قسم'
  };
}

function isFixedItem(item) {
  return [ID_KEY, NAME_KEY, CLASS_KEY, AVG_KEY, CAT_KEY].some(
    key => item.includes(key) || key.includes(item)
  );
}

function isHiddenItem(item) {
  const col = columns.find(c => c.item === item);
  return col && (col.maxType === 'hidden' || col.maxType === 'hiddenSection' || col.sectionHidden);
}

function getItemMax(student, col) {
  if (col.maxType === 'nextColumn' && col.maxIndex !== null) {
    const value = student.__cells ? student.__cells[col.maxIndex] : '';
    const n = toNumber(value);

    return n > 0 ? n : null;
  }

  if (col.max !== null && col.max !== undefined && !isNaN(Number(col.max))) {
    return Number(col.max);
  }

  return null;
}

function getDynamicSections(student) {
  const sections = {};

  columns.forEach(col => {
    if (col.maxType === 'hidden') return;
    if (col.maxType === 'hiddenSection') return;
    if (col.sectionHidden) return;
    if (isFixedItem(col.item)) return;

    const sectionInfo = extractSectionInfo(col.section);
    const sectionKey = sectionInfo.name;

    if (!sections[sectionKey]) {
      sections[sectionKey] = {
        icon: sectionInfo.icon,
        name: sectionInfo.name,
        items: []
      };
    }

    sections[sectionKey].items.push({
      label: col.item,
      value: getValueByItem(student, col.item),
      max: getItemMax(student, col)
    });
  });

  return sections;
}

function getSectionSummary(section) {
  const scoredItems = section.items.filter(item =>
    item.max !== null &&
    item.max !== undefined &&
    !isNaN(Number(item.max)) &&
    Number(item.max) > 0
  );

  if (!scoredItems.length) {
    return null;
  }

  const total = scoredItems.reduce((sum, item) => sum + toNumber(item.value), 0);
  const max = scoredItems.reduce((sum, item) => sum + Number(item.max), 0);

  return {
    total,
    max
  };
}

function buildSectionCard(section) {
  const summary = getSectionSummary(section);

  const summaryHtml = summary && summary.max > 0 ? `
    <div class="bar-row">
      <div class="bar-label-row">
        <span class="bar-label">المجموع</span>
        <span class="bar-val">${formatNumber(summary.total)} / ${formatNumber(summary.max)}</span>
      </div>
      <div class="bar-track">
        <div class="bar-fill" style="width:${pct(summary.total, summary.max)}%"></div>
      </div>
    </div>
  ` : '';

  const rows = section.items.map(item => {
    const hasMax =
      item.max !== null &&
      item.max !== undefined &&
      !isNaN(Number(item.max)) &&
      Number(item.max) > 0;

    const value = item.value || '—';
    const valueText = hasMax
      ? `${escapeHtml(value)} / ${escapeHtml(formatNumber(item.max))}`
      : escapeHtml(value);

    return `
      <div class="score-row">
        <span class="score-label">${escapeHtml(item.label)}</span>
        <span class="score-val ${sc(value)}">${valueText}</span>
      </div>
    `;
  }).join('');

  return `
    <div class="section-card">
      <div class="section-title">
        <span class="icon">${section.icon}</span>
        ${escapeHtml(section.name)}
      </div>
      ${summaryHtml}
      ${rows}
    </div>
  `;
}

function renderStudent(student) {
  const res = document.getElementById('result');

  const avgRaw = getValueByItem(student, AVG_KEY);
  const cat = getValueByItem(student, CAT_KEY);
  const avgNum = toNumber(avgRaw);

  const hasAvg = avgRaw !== '' && !isHiddenItem(AVG_KEY);
  const hasCat = cat !== '' && !isHiddenItem(CAT_KEY);

  const badgeHtml = hasAvg ? `
    <div class="student-badge">
      <span class="avg-num">${formatNumber(avgNum)}</span>
      <span class="avg-label">متوسط الدرجات</span>
    </div>
  ` : '';

  const categoryHtml = hasCat ? `
    <span class="category-pill ${cc(cat)}">${escapeHtml(cat)}</span>
  ` : '';

  const dynamicSections = getDynamicSections(student);

  const sectionsHtml = Object.keys(dynamicSections).map(sectionName => {
    return buildSectionCard(dynamicSections[sectionName]);
  }).join('');

  res.innerHTML = `
    <div class="student-hero">
      <div class="student-avatar">👤</div>

      <div class="student-info">
        <h2>${escapeHtml(getValueByItem(student, NAME_KEY) || '—')}</h2>
        <p>رقم الطالب: ${escapeHtml(getValueByItem(student, ID_KEY))} &nbsp;|&nbsp; الشعبة: ${escapeHtml(getValueByItem(student, CLASS_KEY) || '—')}</p>
        ${categoryHtml}
      </div>

      ${badgeHtml}
    </div>

    <div class="sections-grid">
      ${sectionsHtml || `
        <div class="section-card">
          <div class="section-title">
            <span class="icon">⚠️</span>
            لا توجد أقسام
          </div>
          <div class="score-row">
            <span class="score-label">تنبيه</span>
            <span class="score-val">لا توجد أقسام ظاهرة للعرض</span>
          </div>
        </div>
      `}
    </div>
  `;

  res.style.display = 'block';
}
</script>
